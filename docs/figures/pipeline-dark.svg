<text x="107.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">speech recordings,</text>
<text x="107.0" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">any length</text>
<rect x="32.0" y="140" width="150" height="30" rx="15.0" fill="#132a45" stroke="#35649c" stroke-width="1"/>
<text x="107.0" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a9cdf5">smbs scan</text>
<line x1="214.0" y1="38.0" x2="246.5" y2="38.0" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250.5" y="8" width="206" height="60" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
<text x="353.5" y="45.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f0f6fc">Encoder</text>
<text x="353.5" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">HuBERT-500, mHuBERT</text>
