<text x="1093.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">real word vs</text>
<text x="1093.0" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9">pseudo-word</text>
<rect x="1018.0" y="140" width="150" height="30" rx="15.0" fill="#132a45" stroke="#35649c" stroke-width="1"/>
<text x="1093.0" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a9cdf5">smbs evaluate</text>
