<text x="846.5" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a9cdf5">smbs train</text>
<line x1="953.5" y1="38.0" x2="986.0" y2="38.0" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
