<line x1="707.0" y1="38.0" x2="739.5" y2="38.0" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="743.5" y="8" width="206" height="60" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
