<text x="353.5" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1c5cab">smbs encode</text>
<line x1="460.5" y1="38.0" x2="493.0" y2="38.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="497.0" y="8" width="206" height="60" rx="10" fill="#eef1f5" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="600.0" y="45.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">Unit shards</text>
