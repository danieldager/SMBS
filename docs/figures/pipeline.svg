<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Pipeline in five steps: Audio (smbs scan) is encoded into discrete units by HuBERT-500, mHuBERT or SpidR (smbs encode); the units are written as WebDataset shards and streamed to the GPUs; an LSTM or GPT-2 learns to predict the next unit (smbs train); the model is scored on sWuggy, real word versus pseudo-word (smbs evaluate).">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="4.0" y="8" width="206" height="60" rx="10" fill="#eef1f5" stroke="#57606a" stroke-width="1.5"/>
