<text x="107.0" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1c5cab">smbs scan</text>
<line x1="214.0" y1="38.0" x2="246.5" y2="38.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250.5" y="8" width="206" height="60" rx="10" fill="#eef1f5" stroke="#57606a" stroke-width="1.5"/>
<text x="353.5" y="45.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">Encoder</text>
<text x="353.5" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#424a53">HuBERT-500, mHuBERT</text>
