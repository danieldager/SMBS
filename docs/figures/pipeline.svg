<text x="1093.0" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#424a53">pseudo-word</text>
<rect x="1018.0" y="140" width="150" height="30" rx="15.0" fill="#e3eefb" stroke="#a9c8ef" stroke-width="1"/>
<text x="1093.0" y="160.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1c5cab">smbs evaluate</text>
