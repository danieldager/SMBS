<line x1="707.0" y1="38.0" x2="739.5" y2="38.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="743.5" y="8" width="206" height="60" rx="10" fill="#eef1f5" stroke="#57606a" stroke-width="1.5"/>
<text x="846.5" y="45.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">LSTM or GPT-2</text>
